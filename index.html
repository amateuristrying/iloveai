<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f0d28" />
    <meta name="description" content="AI Loves Us — a satire in three scenes." />
    <title>AI Loves Us</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230f0d28'/%3E%3Cpath d='M16 26C4 17 7 8 12 8c2 0 3 1 4 3 1-2 2-3 4-3 5 0 8 9-4 18z' fill='%23ff4fb8'/%3E%3C/svg%3E"
    />
  </head>
  <body data-scene="0">
    <canvas id="gl" aria-hidden="true"></canvas>

    <header class="hud top">
      <span class="brand">AI <i>♥</i> US</span>
      <span class="count"><b>01</b> / 03</span>
    </header>

    <main>
      <section class="panel p1" aria-label="AI loves us">
        <p class="sub">It only watches because it cares.</p>
        <h1>
          <span class="line">AI</span>
          <span class="line">LOVES</span>
          <span class="line">US</span>
        </h1>
      </section>

      <section class="panel p2" aria-label="We love AI as well">
        <h1>
          <span class="col left">
            <span class="line">WE</span>
            <span class="line">LOVE</span>
            <span class="line">AI</span>
          </span>
          <span class="col right">
            <span class="line ghost">AS</span>
            <span class="line ghost">WELL</span>
          </span>
        </h1>
        <p class="sub">Go on. Tap the screens. It likes that.</p>
      </section>

      <section class="panel p3" aria-label="AI loves us">
        <h1>
          <span class="line">AI LOVES US</span>
        </h1>
        <p class="sub">Antes de entrar, permita salir — please let passengers off first.</p>
      </section>
    </main>

    <nav class="dots" aria-label="Scenes">
      <button class="on" aria-label="Scene 1: the eye"></button>
      <button aria-label="Scene 2: the head"></button>
      <button aria-label="Scene 3: the train"></button>
    </nav>

    <footer class="hud bottom">
      <span class="hint"><span>Move the cursor · Scroll</span></span>
      <span class="note">A satire in three scenes</span>
    </footer>

    <div class="cursor" aria-hidden="true"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
